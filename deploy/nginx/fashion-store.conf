# =====================================================================
# fashion-store Nginx site config (shipped from repo, placed on the
# VPS as /etc/nginx/sites-available/fashion-store)
#
# This block is the HTTP entry (ACME support + everything Nginx needs
# behind certbot). Run:
#   certbot --nginx -d maviposh.com -d www.maviposh.com --redirect
# and certbot injects the TLS (443) server block + HTTPS redirect pairs
# itself. Do NOT hand-write a self-signed 443 block.
#
# Domain maviposh.com / www.maviposh.com is baked in below.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name maviposh.com www.maviposh.com 185.226.119.184 _;

    # ACME challenge must stay over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nginx-served static media (uploads; bypasses Django entirely)
    location /media_libm/ {
        alias /var/www/fashion-store/backend/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Django collected static files (whitenoise manifest)
    location /static/ {
        alias /var/www/fashion-store/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Django API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Django-served SEO files
    location ~ ^/(robots\.txt|sitemap\.xml) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
