<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F8FF"/>
      <stop offset="50%" stop-color="#E1F2FE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0082CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0091DF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  
  <!-- Subtle decorative geometric borders -->
  <rect x="24" y="24" width="552" height="752" rx="24" fill="none" stroke="#BAE3FD" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6"/>
  
  <g transform="translate(300, 370)">
    <!-- Elegant Minimal Hanger / Bag Icon -->
    <path d="M-40 -40 C -40 -60, -20 -80, 0 -80 C 20 -80, 40 -60, 40 -40 C 40 -20, 20 -15, 0 10 L -90 60 C -100 66, -105 76, -100 86 C -96 94, -86 98, -75 98 L 75 98 C 86 98, 96 94, 100 86 C 105 76, 100 66, 90 60 Z" 
          fill="none" stroke="url(#icon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- MAVI Brand Mark -->
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#0082CA" fill-opacity="0.6" text-anchor="middle">MAVI</text>
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#4B6178" fill-opacity="0.5" text-anchor="middle">تصویر به زودی قرار می‌گیرد</text>
  </g>
</svg>
